<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060D">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tarra's Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a living solar system — you are the sun, every category is a planet on its own orbit.
   Click a body and its instruments slide in as a glass panel. Single deep-space theme by design. */
:root{
  --bg:#04060D; --neb-1:rgba(70,92,200,.20); --neb-2:rgba(196,98,58,.10); --neb-3:rgba(120,70,190,.10);
  --glass:rgba(10,15,30,.9); --card:rgba(22,30,54,.62); --card-2:rgba(34,46,78,.55); --raise:#1B2746; --field:rgba(4,7,15,.6);
  --line:rgba(150,180,235,.13); --line-2:rgba(150,180,235,.26);
  --ink:#E9EEF8; --ink-2:#A6B3CC; --ink-3:#6F7E9B;
  --ice:#7CD8F2; --ice-ink:#04222C; --ice-soft:rgba(124,216,242,.13);
  --sun:#FFB25B; --sun-core:#FFEACB; --sun-deep:#E2681A; --sun-soft:rgba(255,178,91,.15);
  --good:#5BD49B; --good-soft:rgba(91,212,155,.15);
  --bad:#FF7B88; --bad-soft:rgba(255,123,136,.15);
  --warn:#FFC85C; --warn-soft:rgba(255,200,92,.15);
  --scrim:rgba(2,4,10,.68);
  --shadow:0 30px 70px -30px rgba(0,0,0,.8);
  --f-display:"Chakra Petch","Avenir Next Condensed","Arial Narrow",sans-serif;
  --f-body:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --pw:min(780px, calc(100vw - 24px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:radial-gradient(1100px 700px at 18% 12%, var(--neb-1), transparent 70%),
    radial-gradient(900px 600px at 88% 92%, var(--neb-2), transparent 70%),
    radial-gradient(700px 500px at 70% 20%, var(--neb-3), transparent 70%);
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ice)}
p{margin:0}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.muted{color:var(--ink-3);font-size:13.5px}

/* ---------- Space (true 3D) ---------- */
/* The orbital plane is tilted in real perspective. Planets ride rotating arms and turn back toward the
   camera, so the browser's 3D depth sorting hides them behind the star on the far side. Every moving
   part is a transform or opacity animation run by the compositor: taps never wait on the scene. */
.space{position:fixed;inset:0;overflow:hidden;contain:strict;perspective:var(--persp, 2400px)}
#sky{position:absolute;left:-36px;top:-36px;width:calc(100% + 72px);height:calc(100% + 72px);display:block;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.glints{position:absolute;inset:-36px;pointer-events:none;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.glints i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(200,220,255,.6);opacity:.3;animation:glint var(--d) ease-in-out var(--dl) infinite}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:1}}
.shoot{position:absolute;top:14%;left:70%;width:150px;height:1px;background:linear-gradient(90deg, rgba(230,240,255,.95), rgba(230,240,255,0));opacity:0;transform:rotate(-24deg);pointer-events:none;animation:shoot 19s linear 5s infinite}
@keyframes shoot{0%{opacity:0;transform:rotate(-24deg) translateX(0)}1%{opacity:1}5%{opacity:0;transform:rotate(-24deg) translateX(-560px)}100%{opacity:0;transform:rotate(-24deg) translateX(-560px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes surf{to{transform:translateX(-50%)}}

.world{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.world > div,.world .arm,.world .car,.world .bb{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.world.ready{transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.world.intro{transition:transform 2.6s cubic-bezier(.16,.84,.22,1)}
.plane{position:absolute;pointer-events:none}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(140,190,240,.22);pointer-events:none;transition:border-color .5s, box-shadow .5s, opacity .5s}
.ring.sel{border-color:var(--c);box-shadow:inset 0 0 20px -6px var(--c)}
.pulse{position:absolute;border-radius:50%;border:1.5px solid rgba(255,190,110,.6);box-shadow:inset 0 0 26px rgba(255,170,80,.24);pointer-events:none;opacity:0;animation:pulse 10s cubic-bezier(.2,.6,.3,1) 3s infinite}
@keyframes pulse{0%{transform:scale(.1);opacity:0}3%{opacity:.75}38%{transform:scale(1);opacity:0}100%{transform:scale(1);opacity:0}}
.sunbb{transform:rotateX(calc(var(--tilt) * -1))}
.arm{animation:orb var(--T) linear var(--d) infinite}
.car{transform:translateX(var(--R))}
.car.enter{animation:launch 1.5s cubic-bezier(.16,.84,.3,1) var(--ed, 0ms) both}
@keyframes launch{from{transform:translateX(0) scale(.04)}to{transform:translateX(var(--R)) scale(1)}}
.bb{animation:bb var(--T) linear var(--d) infinite}
@keyframes orb{from{transform:rotateZ(var(--a0))}to{transform:rotateZ(calc(var(--a0) + 360deg))}}
@keyframes bb{from{transform:rotateZ(calc(var(--a0) * -1)) rotateX(calc(var(--tilt) * -1))}to{transform:rotateZ(calc(var(--a0) * -1 - 360deg)) rotateX(calc(var(--tilt) * -1))}}
.world.static .arm,.world.static .bb{animation:none}
.world.paused .arm,.world.paused .bb{animation-play-state:paused}
@media (hover: hover){ .world:has(.planet:hover) .arm,.world:has(.planet:hover) .bb{animation-play-state:paused} }
/* Hover glow only where a real pointer hovers: on touch screens a tap would leave it stuck and repaint big blurred shadows. */
@media (hover: hover){
.sun:hover .core::before{opacity:1}
.sun:hover::before{background:var(--halo-hi)}
.planet:hover .hud{opacity:1}
.planet:hover .globe::before{opacity:1;box-shadow:inset 0 0 0 1.5px var(--hc)}
.planet:hover .aura{opacity:1}
}
.space.covered{visibility:hidden}
.space.covered *,.space.modal *{animation-play-state:paused!important}
/* With the panel covering the screen on a phone nothing else animates: frames are produced only when you touch something. */
.space.covered ~ .top .brand-mark::after,.space.covered ~ .pv .pv-head *{animation:none}

/* Star: core, rotating corona and two instrument rings (pre-drawn textures, cheap to rotate) */
/* In a 3D scene the browser clips anything left of or above a layer's own box, so the star and each
   planet are boxes large enough to hold all of their parts, centred on their position. Only the
   visible parts take clicks. */
.sun{position:absolute;left:0;top:0;--S:max(260px, calc(var(--sr) * 4.8));width:var(--S);height:var(--S);margin:calc(var(--S) / -2) 0 0 calc(var(--S) / -2);border:0;padding:0;background:none;cursor:pointer;color:var(--ink);pointer-events:none}
.sun{--halo:radial-gradient(closest-side, rgba(255,184,100,.58) calc(var(--sr) - 2px), rgba(255,160,80,.30) calc(var(--sr) + 20px), rgba(255,148,68,.13) calc(var(--sr) + 58px), rgba(255,140,60,.045) calc(var(--sr) + 105px), transparent);
  --halo-hi:radial-gradient(closest-side, rgba(255,190,105,.78) calc(var(--sr) - 2px), rgba(255,165,82,.42) calc(var(--sr) + 24px), rgba(255,150,70,.18) calc(var(--sr) + 66px), rgba(255,140,60,.06) calc(var(--sr) + 115px), transparent)}
.sun::before{content:"";position:absolute;left:50%;top:50%;width:calc(var(--sr) * 2 + 290px);height:calc(var(--sr) * 2 + 290px);margin:calc(var(--sr) * -1 - 145px) 0 0 calc(var(--sr) * -1 - 145px);border-radius:50%;background:var(--halo);animation:breathe 7s ease-in-out infinite;pointer-events:none}
.sun .corona,.sun .sring{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.sun .corona{width:calc(var(--sr) * 3.5);height:calc(var(--sr) * 3.5);margin:calc(var(--sr) * -1.75) 0 0 calc(var(--sr) * -1.75);background-image:var(--t-corona);animation:spin 160s linear infinite}
.sun .s1{width:calc(var(--sr) * 2.5);height:calc(var(--sr) * 2.5);margin:calc(var(--sr) * -1.25) 0 0 calc(var(--sr) * -1.25);background-image:var(--t-ticks);animation:spin 70s linear infinite}
.sun .s2{width:calc(var(--sr) * 2.95);height:calc(var(--sr) * 2.95);margin:calc(var(--sr) * -1.475) 0 0 calc(var(--sr) * -1.475);background-image:var(--t-arcs);animation:spin 48s linear infinite reverse}
.sun .core{position:absolute;left:50%;top:50%;width:calc(var(--sr) * 2);height:calc(var(--sr) * 2);margin:calc(var(--sr) * -1) 0 0 calc(var(--sr) * -1);pointer-events:auto;border-radius:50%;background:radial-gradient(circle at 38% 34%, var(--sun-core) 0, var(--sun) 46%, var(--sun-deep) 100%);box-shadow:inset -8px -10px 24px rgba(160,60,10,.45)}
.sun .core::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 60% 60%, rgba(255,255,255,.035) 0 3px, transparent 3px 9px)}
.sun .core::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:1;box-shadow:inset 0 0 0 2px rgba(255,234,203,.75);opacity:0;transition:opacity .2s}
.sun.sel .core::before{opacity:1}
.sun.sel::before{background:var(--halo-hi)}
.sun:focus-visible{outline:none}
.sun:focus-visible .core{outline:2px solid var(--ice);outline-offset:6px}
.sun-lbl{position:absolute;top:calc(50% + var(--sr) * 1.55 + 8px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap;pointer-events:none}
.sun-lbl b{display:block;font:700 12.5px/1 var(--f-display);letter-spacing:.36em;padding:5px 8px 5px 13px;background:rgba(4,8,18,.82);border:1px solid rgba(255,190,110,.45);color:#FFF4E6}
.sun-lbl small{font:500 10.5px var(--f-mono);color:var(--sun);letter-spacing:.05em;text-shadow:0 1px 8px #000}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}

/* Planet: shaded globe with a scrolling surface, a scan sweep, an instrument ring and a satellite */
.planet{position:absolute;left:0;top:0;--S:max(230px, calc(var(--r) * 4.6 + 60px));width:var(--S);height:var(--S);margin:calc(var(--S) / -2) 0 0 calc(var(--S) / -2);overflow:visible;border:0;padding:0;background:none;cursor:pointer;color:var(--ink);pointer-events:none;--hc:color-mix(in srgb, var(--c) 70%, #fff)}
.planet > .pc{position:absolute;left:50%;top:50%;width:0;height:0}
/* Animated parts take part in the 3D scene themselves instead of being flattened into one clipped layer. */
.planet,.planet > .pc,.sun{transform-style:preserve-3d}
.planet .hit,.planet .globe,.planet .lbl{pointer-events:auto}
.planet .globe,.planet .lbl,.planet .sat,.planet .rb,.planet .rf{transition:opacity .5s}
.world.focusing .planet:not(.sel) .globe,.world.focusing .planet:not(.sel) .lbl,.world.focusing .planet:not(.sel) .sat,.world.focusing .planet:not(.sel) .rb,.world.focusing .planet:not(.sel) .rf{opacity:.38}
.world.focusing .planet:not(.sel) .hud,.world.focusing .planet:not(.sel) .aura{opacity:.18}
.world.focusing .ring:not(.sel){opacity:.45}
.planet .hit{position:absolute;border-radius:50%;--hr:max(22px, calc(var(--r) * 1.5));left:calc(var(--hr) * -1);top:calc(var(--hr) * -1);width:calc(var(--hr) * 2);height:calc(var(--hr) * 2)}
.globe{width:calc(var(--r) * 2);height:calc(var(--r) * 2);border-radius:50%;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 36% 30%, color-mix(in srgb, var(--c) 55%, #fff) 0, var(--c) 34%, color-mix(in srgb, var(--c) 32%, #050814) 80%);
  box-shadow:0 0 calc(var(--r) * 1.4) color-mix(in srgb, var(--c) 40%, transparent), inset 0 0 calc(var(--r) * .5) color-mix(in srgb, var(--c) 75%, #fff)}
.planet .globe{position:absolute;left:calc(var(--r) * -1);top:calc(var(--r) * -1);box-shadow:inset 0 0 calc(var(--r) * .5) color-mix(in srgb, var(--c) 75%, #fff)}
.planet .aura{position:absolute;--ar:calc(var(--r) * 2.7);left:calc(var(--ar) * -1);top:calc(var(--ar) * -1);width:calc(var(--ar) * 2);height:calc(var(--ar) * 2);border-radius:50%;pointer-events:none;opacity:.7;transition:opacity .3s;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--c) 62%, transparent) calc(var(--r) - 1px), color-mix(in srgb, var(--c) 30%, transparent) calc(var(--r) * 1.35), color-mix(in srgb, var(--c) 11%, transparent) calc(var(--r) * 1.95), transparent)}
.globe::before{transition:opacity .2s}
.globe::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 33% 27%, rgba(255,255,255,.5), rgba(255,255,255,.06) 24%, transparent 44%), radial-gradient(circle at 64% 68%, transparent 38%, rgba(3,5,14,.55) 78%, rgba(3,5,14,.85) 100%)}
.globe::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:3;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, #fff);opacity:.45}
.globe .surf{position:absolute;top:0;left:0;width:200%;height:100%;animation:surf var(--surf, 24s) linear infinite}
.skin-grid .surf{background-image:repeating-linear-gradient(0deg, transparent 0 calc(20% - 1px), rgba(255,255,255,.3) calc(20% - 1px) 20%), linear-gradient(90deg, rgba(255,255,255,.32) 0 1px, transparent 1px);background-size:100% 100%, 12.5% 100%}
.skin-bands .surf{background-image:radial-gradient(ellipse 9% 7% at 30% 64%, rgba(255,255,255,.6), transparent 70%), linear-gradient(180deg, transparent 0 10%, rgba(255,255,255,.18) 10% 19%, rgba(0,0,0,.22) 19% 30%, rgba(255,255,255,.1) 30% 42%, rgba(0,0,0,.16) 42% 50%, rgba(255,255,255,.22) 50% 57%, rgba(0,0,0,.24) 57% 70%, rgba(255,255,255,.12) 70% 82%, transparent 82%);background-size:50% 100%, 100% 100%}
.skin-land .surf{background-image:radial-gradient(ellipse 18% 24% at 22% 34%, rgba(255,255,255,.38), transparent 72%), radial-gradient(ellipse 13% 18% at 66% 66%, rgba(255,255,255,.3), transparent 72%), radial-gradient(ellipse 8% 6% at 54% 22%, rgba(255,255,255,.32), transparent 72%), radial-gradient(ellipse 10% 8% at 86% 40%, rgba(0,0,0,.28), transparent 72%);background-size:50% 100%}
.skin-lights .surf{background-image:radial-gradient(circle, rgba(255,255,255,.95) 0 .7px, transparent 1.4px), radial-gradient(circle, rgba(255,255,255,.55) 0 .5px, transparent 1.1px);background-size:6.25% 16%, 4.1666% 11%;background-position:0 0, 3px 5px}
.globe .scan{position:absolute;left:0;right:0;top:0;height:26%;z-index:4;opacity:0;background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--c) 35%, #fff), transparent);animation:scan 7s ease-in-out var(--sd, 0s) infinite}
@keyframes scan{0%{transform:translateY(-110%);opacity:0}8%{opacity:.7}45%{transform:translateY(400%);opacity:.55}50%,100%{transform:translateY(400%);opacity:0}}
.hud{position:absolute;width:calc(var(--r) * 3.1);height:calc(var(--r) * 3.1);border-radius:50%;pointer-events:none;opacity:.55;transition:opacity .2s;background-image:var(--t-hud);background-position:center;background-size:100% 100%;background-repeat:no-repeat;animation:spin var(--spin, 16s) linear infinite}
.planet .hud{left:calc(var(--r) * -1.55);top:calc(var(--r) * -1.55)}
.planet .sat{position:absolute;left:calc(var(--r) * -1.95);top:calc(var(--r) * -1.95);width:calc(var(--r) * 3.9);height:calc(var(--r) * 3.9);pointer-events:none;animation:spin var(--sat, 9s) linear infinite reverse}
.planet .sat i{position:absolute;left:50%;top:7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px var(--c)}
.planet .rb,.planet .rf{position:absolute;left:calc(var(--r) * -2.1);top:calc(var(--r) * -.6);width:calc(var(--r) * 4.2);height:calc(var(--r) * 1.2);border-radius:50%;transform:rotate(-17deg);pointer-events:none;border:1.5px solid transparent}
.planet .rb{border-top-color:var(--hc);opacity:.45}
.planet .rf{border-bottom-color:var(--hc);opacity:.85;box-shadow:0 3px 0 -1.5px color-mix(in srgb, var(--c) 35%, transparent)}
.planet .lbl{position:absolute;top:calc(var(--r) * 1.75 + 6px);left:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}
.lbl b{display:block;font:600 11px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;padding:4px 6px 4px 8px;background:rgba(4,8,18,.82);border:1px solid color-mix(in srgb, var(--c) 45%, transparent);color:#EAF1FF}
.lbl small{display:block;font:500 10.5px/1.2 var(--f-mono);color:var(--hc);letter-spacing:.03em;text-shadow:0 1px 6px #000}
.planet.sel .hud{opacity:1}
.planet.sel .globe::before{opacity:1;box-shadow:inset 0 0 0 1.5px var(--hc)}
.planet.sel .aura{opacity:1}
.planet:focus-visible{outline:none}
.planet:focus-visible .globe{outline:2px solid var(--ice);outline-offset:5px}

/* Small globes (tiles, forms) and the live one in the panel header */
.mini{position:relative;display:inline-block;width:calc(var(--r) * 2);height:calc(var(--r) * 2);flex:none;--hc:color-mix(in srgb, var(--c) 70%, #fff)}
.mini .globe{position:absolute;inset:0;width:auto;height:auto;box-shadow:0 0 calc(var(--r) * 1.2) color-mix(in srgb, var(--c) 40%, transparent), inset 0 0 calc(var(--r) * .5) color-mix(in srgb, var(--c) 75%, #fff)}
.mini .surf{animation:none}
.mini.live .surf{animation:surf 26s linear infinite}
.mini:not(.live) .globe{box-shadow:inset 0 0 calc(var(--r) * .5) color-mix(in srgb, var(--c) 75%, #fff)}
.mini:not(.live) .globe::before{display:none}
.mini .hud{left:calc(var(--r) * -.55);top:calc(var(--r) * -.55)}
.sunmini{border-radius:50%;background:radial-gradient(circle at 38% 34%, var(--sun-core), var(--sun) 46%, var(--sun-deep));box-shadow:0 0 12px rgba(255,170,80,.5)}

/* ---------- Chrome over space ---------- */
.frame{position:fixed;z-index:5;pointer-events:none;top:calc(8px + env(safe-area-inset-top, 0px));bottom:calc(8px + env(safe-area-inset-bottom, 0px));left:max(8px, env(safe-area-inset-left, 0px));right:max(8px, env(safe-area-inset-right, 0px))}
.frame i{position:absolute;width:18px;height:18px;border:0 solid rgba(124,216,242,.32)}
.frame i:nth-child(1){top:0;left:0;border-width:1px 0 0 1px}
.frame i:nth-child(2){top:0;right:0;border-width:1px 1px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-width:0 0 1px 1px}
.frame i:nth-child(4){bottom:0;right:0;border-width:0 1px 1px 0}
.hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:6;pointer-events:none;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;animation:hintfade 9s ease 2.5s both}
.hint.off{visibility:hidden}
.sync{cursor:pointer}
@keyframes hintfade{0%{opacity:0}10%,75%{opacity:.9}100%{opacity:0}}
.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;
  padding-top:calc(16px + env(safe-area-inset-top, 0px));padding-bottom:12px;
  padding-left:max(22px, env(safe-area-inset-left, 0px));padding-right:max(22px, env(safe-area-inset-right, 0px))}
.top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.brand-mark{position:relative;width:28px;height:28px;flex:none;border-radius:50%;background:radial-gradient(circle, var(--sun-core) 0, var(--sun) 30%, transparent 34%)}
.brand-mark::before{content:"";position:absolute;inset:4px;border-radius:50%;box-shadow:0 0 14px rgba(255,170,80,.45)}
.brand-mark::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,205,150,.65);border-left-color:transparent;border-right-color:transparent;animation:spin 10s linear infinite}
.brand-name{font:700 16px/1 var(--f-display);letter-spacing:.3em}
.brand-sub{font:500 10px/1 var(--f-mono);letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-top:6px;white-space:nowrap}
.top-tools{display:flex;align-items:center;gap:8px}
.sync{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border-radius:4px;font:500 10.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:rgba(6,10,22,.88);border:1px solid rgba(150,190,240,.16);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.sync[data-s="ok"] i{background:var(--good);box-shadow:0 0 8px var(--good)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="err"] i{background:var(--bad)}
.sync[data-s="local"] i{background:var(--sun)}
.top.shift .sync span{display:none}
.top.shift .brand{overflow:hidden}
.top.shift .brand-sub{overflow:hidden;text-overflow:ellipsis;max-width:22vw}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:border-color .15s, background .15s}
.btn:hover{border-color:var(--ice)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--ice);color:var(--ice-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sunb{background:var(--sun-soft);color:var(--sun);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:transparent;background:var(--bad-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.glassbtn{height:34px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.iconbtn{min-width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;flex:none;padding:0}
.iconbtn:hover{background:var(--card-2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.armed{color:var(--bad)!important;background:var(--bad-soft)!important;padding:0 10px!important;font:600 12px var(--f-body)!important;border-color:transparent!important;width:auto!important}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font:600 11px/1 var(--f-mono);letter-spacing:.02em;background:var(--card-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ice{background:var(--ice-soft);color:var(--ice)}
.chip.sunc{background:var(--sun-soft);color:var(--sun)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--ink-3);font:600 12px var(--f-mono);padding:6px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.meter{height:6px;border-radius:99px;background:var(--card-2);overflow:hidden}
.meter > i{display:block;height:100%;background:var(--accent, var(--ice));border-radius:inherit}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.segs i{height:6px;border-radius:2px;background:var(--card-2)}
.segs i.on{background:var(--accent, var(--ice))}
input,select,textarea{background:var(--field);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;min-width:0;width:100%;outline:none}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--ice);box-shadow:0 0 0 3px var(--ice-soft)}
input[type="range"]{padding:0;border:0;box-shadow:none;accent-color:var(--accent, var(--ice));background:transparent}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--ice);padding:0}
.inline{display:flex;gap:8px;margin-top:12px}
.inline input{height:36px;padding:0 11px}
.inline .btn{height:36px}
.label{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent, var(--ice));margin:0 0 8px}
h1{font:600 clamp(26px,3.4vw,36px)/1.05 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font:600 14px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin:0}
h3{font:600 22px/1.15 var(--f-display);margin:0;text-wrap:balance}
.big{font:600 32px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{font:500 12px var(--f-mono);color:var(--ink-3);margin-left:6px;letter-spacing:.04em}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ---------- Panel ---------- */
.pv{position:fixed;z-index:60;display:flex;flex-direction:column;
  top:calc(12px + env(safe-area-inset-top, 0px));bottom:calc(12px + env(safe-area-inset-bottom, 0px));right:max(12px, env(safe-area-inset-right, 0px));width:var(--pw);
  background:rgba(9,13,27,.96);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  transform:translateX(calc(100% + 40px));visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s linear .38s}
.pv.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s}
.pv::before{content:"";position:absolute;inset:0 0 auto;height:180px;border-radius:22px 22px 0 0;background:radial-gradient(500px 180px at 20% 0, color-mix(in srgb, var(--accent, var(--ice)) 16%, transparent), transparent);pointer-events:none}
.pv-head{display:flex;align-items:center;gap:14px;padding:18px 16px 14px 20px;border-bottom:1px solid var(--line);position:relative}
.pv-orb{width:40px;height:40px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--accent) 38%, #fff), var(--accent) 45%, color-mix(in srgb, var(--accent) 40%, #000));box-shadow:0 0 24px color-mix(in srgb, var(--accent) 45%, transparent)}
.pv-head .eyebrow{margin-bottom:6px}
.pv-head h1{font-size:26px}
.pv-tools{margin-left:auto;display:flex;gap:4px;align-self:flex-start}
.pv-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px 20px 32px;container-type:inline-size;position:relative}
.view{display:flex;flex-direction:column;gap:18px}
.vh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.vh .sub{color:var(--ink-2);max-width:60ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-h .label{margin-top:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .t small{display:block;color:var(--ink-3);font:500 11px var(--f-mono);letter-spacing:.04em;margin-top:2px}
.check{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left}
.rows > .check:first-child{border-top:0}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent}
.box svg{width:13px;height:13px}
.check[aria-pressed="true"] .box{background:var(--accent, var(--ice));border-color:var(--accent, var(--ice));color:var(--ice-ink)}
.check .t{flex:1;min-width:0}
.check[aria-pressed="true"] .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.check .streak{font:600 11px var(--f-mono);color:var(--sun)}
.tick{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);background:none;cursor:pointer;color:transparent;flex:none;padding:0}
.tick svg{width:13px;height:13px}
.tick[aria-pressed="true"]{background:var(--accent, var(--ice));border-color:var(--accent, var(--ice));color:var(--ice-ink)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border:1px dashed var(--line-2);border-radius:14px}
.empty-t{font-weight:600}
.chart{width:100%;min-height:60px}
.chart svg{display:block}
.chart-empty{display:grid;place-items:center;height:100%;min-height:120px;border:1px dashed var(--line-2);border-radius:12px;color:var(--ink-3);font-size:13.5px;text-align:center;padding:16px}
.gl{stroke:var(--line)} .zl{stroke:var(--line-2);stroke-dasharray:3 4}
.tl{fill:var(--ink-3);font:500 10.5px var(--f-mono)}
.ln{fill:none;stroke:var(--accent, var(--ice));stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.bar{fill:var(--accent, var(--ice))}
.note-band{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--bad-soft)}
.note-band b{font-family:var(--f-display);letter-spacing:.04em}

/* Sun view */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:end}
@container (min-width: 600px){ .hero{grid-template-columns:minmax(0,1fr) auto} }
.hero .date{font:500 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.hero .sub{color:var(--ink-2);font-size:15.5px;margin-top:10px;max-width:56ch}
.tminus{position:relative;padding:14px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-width:200px}
.tminus::before,.tminus::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid var(--sun);opacity:.8}
.tminus::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.tminus::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.digits{font:600 56px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:8px 0 6px}
.digits.warn{color:var(--warn)}
.tm-sub{color:var(--ink-2);font-size:13.5px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.ptile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer;color:var(--ink);min-width:0;transition:border-color .2s, transform .2s}
.ptile:hover{border-color:var(--c);transform:translateY(-1px)}
.ptile .pt-top{display:flex;align-items:center;gap:10px}
.ptile .dot{width:18px;height:18px}
.ptile b{font:600 15px/1.2 var(--f-display);letter-spacing:.04em;overflow-wrap:anywhere}
.ptile small{font:500 11.5px var(--f-mono);color:var(--ink-2)}
.ptile.newp{border-style:dashed;color:var(--ice);align-items:flex-start;justify-content:center}
.agenda .ag{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.agenda .ag:first-child{border-top:0}
.ag-d{width:46px;flex:none;text-align:center;padding:6px 0;border-radius:10px;background:var(--card-2)}
.ag-d b{display:block;font:600 19px/1 var(--f-display)}
.ag-d span{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ag .t{flex:1;min-width:0}
.ag .t div:first-child{font-weight:600;overflow-wrap:anywhere}
.from{display:inline-flex;align-items:center;gap:6px}
.from .dot{width:9px;height:9px}

/* Studio */
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.exam{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0}
.exam.soon{border-color:var(--warn)}
.exam-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.exam-title{font-weight:600}
.exam-meta{color:var(--ink-2);font-size:13.5px}
.exam-actions{display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:8px}
.grade{font:600 24px/1 var(--f-display);color:var(--good)}
.pct{font:600 24px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.topics{display:flex;flex-direction:column;margin-top:12px}
.topic{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.topic.is-done .t{color:var(--ink-3)}
.st{font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:5px 7px;border:1px solid var(--line-2);background:transparent;color:var(--ink-3);cursor:pointer;flex:none;width:76px}
.st-doing{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.st-done{color:var(--good);background:var(--good-soft);border-color:transparent}
.timer-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer-row select{flex:1;min-width:150px;height:40px;padding:0 10px}
.clock{font:600 38px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:6ch;text-align:center}
.clock.on{color:var(--sun)}

/* Trading */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@container (min-width: 640px){ .stats{grid-template-columns:repeat(4,minmax(0,1fr))} }
.stat{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.stat .v{font:600 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .v small{font:500 12px var(--f-mono);color:var(--ink-3)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font:500 10px var(--f-mono);color:var(--ink-3);text-align:center;letter-spacing:.1em;padding-bottom:4px}
.cal .d{min-height:46px;border-radius:8px;background:var(--card-2);padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;font:500 10.5px var(--f-mono);color:var(--ink-3)}
.cal .d b{font-weight:600;font-size:11px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d.has span{color:var(--ink)}
.cal .d.out{visibility:hidden}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--ice)}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
th{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.note{color:var(--ink-2);max-width:260px;overflow-wrap:anywhere}
.dir{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.dir.long{color:var(--good)} .dir.short{color:var(--bad)}
.rules{list-style:none;margin:0;padding:0;counter-reset:r}
.rules li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.rules li:first-child{border-top:0}
.rules li::before{counter-increment:r;content:counter(r, decimal-leading-zero);font:600 11px var(--f-mono);color:var(--accent);flex:none}
.rules li span{flex:1;min-width:0;overflow-wrap:anywhere}
.limit-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.limit-row input{width:120px;height:36px}

/* Allenamento */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.wd{border-radius:10px;padding:8px 4px;text-align:center;background:var(--card-2);min-width:0}
.wd .label{display:block}
.wd b{display:block;font:600 12px var(--f-display);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3)}
.wd.on{background:color-mix(in srgb, var(--accent) 18%, transparent)}
.wd.on b{color:var(--accent)}
.wd.today{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.nextday{font:600 28px/1.05 var(--f-display);color:var(--accent)}
.split{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* Obiettivi */
.vision{min-height:110px;font-size:15.5px;line-height:1.6;background:transparent;border:1px dashed var(--line-2)}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:320px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--card-2);position:relative;overflow:hidden}
.heat i b{position:absolute;inset:0;background:var(--accent)}
.heat i.future{visibility:hidden}
.heat i.today{box-shadow:inset 0 0 0 1.5px var(--sun)}
.goal{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.goal:first-child{border-top:0}
.goal-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.goal-top .t{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.goal-pct{font:600 13px var(--f-mono);color:var(--accent);min-width:4ch;text-align:right}

/* ---------- Dialog ---------- */
dialog{border:1px solid var(--line-2);border-radius:18px;background:#0D1428;color:var(--ink);padding:0;width:min(560px, calc(100% - 32px));max-height:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:var(--scrim)}
#sheetForm{display:flex;flex-direction:column;max-height:calc(100dvh - 32px)}
.sheet-h{padding:20px 20px 4px}
.sheet-b{padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:auto}
.sheet-f{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field > span{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lift{display:grid;grid-template-columns:minmax(0,1fr) 78px 66px 32px;gap:8px;align-items:center}
.lifts{display:flex;flex-direction:column;gap:8px}
.form-err{color:var(--bad);font-size:13px;padding:0 20px 8px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{display:block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--c) 40%, #fff), var(--c) 45%, color-mix(in srgb, var(--c) 40%, #000))}
.sw input:checked + i{box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ice)}
.sw input:focus-visible + i{outline:2px solid var(--ice);outline-offset:4px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.type{position:relative;display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;cursor:pointer}
.type input{position:absolute;opacity:0;width:1px;height:1px}
.type b{font:600 13.5px var(--f-display);letter-spacing:.04em}
.type small{color:var(--ink-3);font-size:12px;line-height:1.35}
.type:has(input:checked){border-color:var(--ice);background:var(--ice-soft)}
.type:has(input:focus-visible){outline:2px solid var(--ice);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:500}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom, 0px));transform:translate(-50%, 16px);opacity:0;z-index:90;pointer-events:none;background:var(--raise);color:var(--ink);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:opacity .2s, transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%, 0)}

/* ---------- HUD skin: squared instruments, corner ticks, segmented meters ---------- */

/* Startup guard: if the app cannot start, say why on screen instead of leaving an empty sky. */
(function () {
  function show(msg) {
    var d = document.getElementById('bootErr');
    if (!d) { d = document.createElement('pre'); d.id = 'bootErr'; (document.body || document.documentElement).appendChild(d); }
    d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:999;margin:0;background:#2a0d12;color:#ffd6dc;border:1px solid #ff6b81;border-radius:10px;padding:12px 14px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap';

  window.addEventListener('error', function (e) { if (!window.__tsbOK) show('Errore all\'avvio: ' + e.message + ' (riga ' + e.lineno + ')'); });

})();

  goal(fd, p, d) { const title = String(fd.get('title') || '').trim(); if (!title) throw new Error('Scrivi l\'obiettivo.'); d.goals.push({ id: uid(), title, area: String(fd.get('area') || '').trim(), due: fd.get('due') || '', progress: 0 }); commit('p_' + p.id); toast('Obiettivo aggiunto'); },
  task(fd, p, d) { const title = String(fd.get('title') || '').trim(); if (!title) throw new Error('Scrivi l\'attività.'); d.tasks.push({ id: uid(), title, area: String(fd.get('area') || '').trim(), due: fd.get('due') || '', done: false }); commit('p_' + p.id); toast('Attività aggiunta'); },
  metric(fd, p, d) { const name = String(fd.get('name') || '').trim(); if (!name) throw new Error('Scrivi cosa misuri.'); d.metric = { name: name.slice(0, 40), unit: String(fd.get('unit') || '').trim().slice(0, 16) }; commit('p_' + p.id); toast('Contatore aggiornato'); },
};
sheetForm.addEventListener('submit', e => {
  e.preventDefault();
  const kind = sheetForm.dataset.kind, p = planet(sheetForm.dataset.p), fd = new FormData(sheetForm);
  try { const after = SUBMIT[kind](fd, p, p ? pd(p.id) : null, sheetForm.dataset.id); sheet.close(); render(); if (typeof after === 'function') after(); }
  catch (err) { const el = $('#formErr'); el.textContent = err.message; el.hidden = false; }
});

/* ================= Actions ================= */
function arm(btn, fn, label = 'Elimina?') {
  if (btn.dataset.armed) { fn(); return; }
  btn.dataset.armed = '1'; const old = btn.innerHTML; btn.classList.add('armed'); btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.classList.remove('armed'); btn.innerHTML = old; } }, 3000);
}
const DEL = {
  trade: (d, id) => { d.trades = d.trades.filter(x => x.id !== id); },
  exam: (d, id) => { d.exams = d.exams.filter(x => x.id !== id); },
  topic: (d, id) => { d.topics = d.topics.filter(x => x.id !== id); },
  course: (d, id) => { d.courses = d.courses.filter(x => x.id !== id); d.topics = d.topics.filter(x => x.courseId !== id); d.exams = d.exams.filter(x => x.courseId !== id); d.sessions = d.sessions.filter(x => x.courseId !== id); },
  session: (d, id) => { d.sessions = d.sessions.filter(x => x.id !== id); },
  goal: (d, id) => { d.goals = d.goals.filter(x => x.id !== id); },
  task: (d, id) => { d.tasks = d.tasks.filter(x => x.id !== id); },
  habit: (d, id) => { d.habits = d.habits.filter(x => x.id !== id); },
  rule: (d, id) => { d.rules = d.rules.filter(x => x.id !== id); },
  entry: (d, id) => { d.entries = d.entries.filter(x => x.id !== id); },
};
function toggleHabit(d, id, date = ymd()) {
  const arr = d.checks[date] || [], has = arr.includes(id);
  if (has) arr.splice(arr.indexOf(id), 1); else arr.push(id);
  if (arr.length) d.checks[date] = arr; else delete d.checks[date];
  const cutoff = ymd(addDays(new Date(), -120)); Object.keys(d.checks).forEach(k => { if (k < cutoff) delete d.checks[k]; });
}
function addStudy(pid, courseId, min) { const d = pd(pid); d.sessions.push({ id: uid(), courseId, date: ymd(), min: Math.round(min) }); if (d.sessions.length > 1500) d.sessions = d.sessions.slice(-1500); commit('p_' + pid); }
// Instant, in-place feedback on the control that was touched.
const flip = b => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
const pressOnly = b => b.parentElement.querySelectorAll('[aria-pressed]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, pid = b.dataset.p, id = b.dataset.id, d = pid ? pd(pid) : null;
  switch (act) {
    case 'noop': return;
    case 'sync': if (mode !== 'gas' || keyBad) askKey(); else if (!anyPending()) { setSync('saving', 'Sincronizzo…'); pull(); } return;
    case 'open': if (ui.open === pid) closePanel(); else openPanel(pid); break;
    case 'sun': if (ui.open === 'sun') closePanel(); else openPanel('sun'); break;
    case 'close': closePanel(); break;
    case 'pause': paused = !paused; lsSet('tsb2-paused', paused ? '1' : '0'); setPauseIcon(); break;
    case 'planet-new': openSheet('planet-new'); break;
    case 'planet-edit': openSheet('planet-edit', pid); break;
    case 'planet-del': arm(b, () => { const p = planet(pid); D.planets.list = D.planets.list.filter(x => x.id !== pid); delete D['p_' + pid]; normalizeRings(); commit('planets'); commit('p_' + pid); sheet.close(); if (ui.open === pid) closePanel(); render(); toast(`${p ? p.name : 'Pianeta'} eliminato`); }, 'Conferma: elimina tutto'); break;
    case 'sheet': openSheet(b.dataset.kind, pid || '', id || '', b.dataset.date || ''); break;
    case 'sheet-close': sheet.close(); break;
    case 'lift-add': $('#lifts').insertAdjacentHTML('beforeend', liftRow()); break;
    case 'lift-del': b.closest('.lift').remove(); break;
    case 'del': arm(b, () => { DEL[b.dataset.kind](d, id); const row = b.closest('tr, .row, .topic, .goal, .exam, li, .chip, .card'); if (row) row.remove(); commit('p_' + pid); render(); toast('Eliminato'); }); break;
    case 'habit': flip(b); toggleHabit(d, id); commit('p_' + pid); render(); break;
    case 'task': { const t = d.tasks.find(x => x.id === id); if (!t) return; flip(b); t.done = !t.done; t.doneAt = t.done ? ymd() : ''; commit('p_' + pid); render(); if (t.done) toast('Fatto'); break; }
    case 'topic-cycle': { const t = d.topics.find(x => x.id === id); if (!t) return; t.status = { todo: 'doing', doing: 'done', done: 'todo' }[t.status] || 'doing'; b.className = 'st st-' + t.status; b.textContent = STATUS[t.status]; const row = b.closest('.topic'); if (row) row.classList.toggle('is-done', t.status === 'done'); commit('p_' + pid); render(); break; }
    case 'cal': { const [y, m] = ui.calMonth.split('-').map(Number); const dt = new Date(y, m - 1 + Number(b.dataset.v), 1); ui.calMonth = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; queuePanel(); break; }
    case 'task-filter': pressOnly(b); ui.taskFilter = b.dataset.v; queuePanel(); break;
    case 'all-trades': ui.allTrades = true; b.disabled = true; queuePanel(); break;
    // trading journal
    case 'tr-tab': { if (ui.trTab === b.dataset.v) return; const bar = b.closest('.tabs'); if (bar) bar.querySelectorAll('[role=tab]').forEach(x => x.setAttribute('aria-selected', String(x === b))); ui.trTab = b.dataset.v; ui.allTrades = false; queuePanel(true); break; }
    case 'tf-range': pressOnly(b); ui.tf.range = b.dataset.v === 'ytd' ? 'ytd' : Number(b.dataset.v); queuePanel(); break;
    case 'tf-reset': ui.tf = { ...TF0, range: ui.tf.range }; queuePanel(); break;
    case 'trade-edit': openSheet('trade', pid, id); break;
    case 'trade-del': arm(b, () => { DEL.trade(d, id); commit('p_' + pid); sheet.close(); render(); toast('Trade eliminato'); }, 'Conferma eliminazione'); break;
    case 'jday': ui.trTab = 'journal'; ui.jDate = b.dataset.v; queuePanel(true); break;
    case 'jnav': { const v = Number(b.dataset.v); ui.jDate = v === 0 ? ymd() : ymd(addDays(parseYmd(ui.jDate), v)); queuePanel(); break; }
    case 'jset': { const day = d.days[b.dataset.date] = d.days[b.dataset.date] || {}, k = b.dataset.k, v = b.dataset.v, off = String(day[k]) === v; day[k] = off ? '' : v; b.parentElement.querySelectorAll('[aria-pressed]').forEach(x => x.setAttribute('aria-pressed', String(!off && x === b))); commit('p_' + pid); render(); break; }
    case 'pv-del': { delete d.settings.pointValues[b.dataset.v]; const row = b.closest('.row'); if (row) row.remove(); commit('p_' + pid); render(); break; }
    case 'tag-del': d.tags = d.tags.filter(t => t !== b.dataset.v); { const c = b.closest('.chip'); if (c) c.remove(); } commit('p_' + pid); render(); break;
    case 'timer-start': { if (timer) { toast('C\'è già un timer in corso'); return; } const sel = $('#timerCourse-' + pid); if (!sel) return; timer = { pid, courseId: sel.value, start: Date.now() }; lsSet('tsb2-timer', JSON.stringify(timer)); queuePanel(); break; }
    case 'timer-stop': {
      if (!timer) return; const min = (Date.now() - timer.start) / 60000, t = timer; timer = null; lsDel('tsb2-timer');
      if (min >= 1 && pd(t.pid)) { addStudy(t.pid, t.courseId, min); toast(`${fmtMin(min)} di ${courseName(pd(t.pid), t.courseId)} salvati`); } else toast('Sessione sotto il minuto: non salvata');
      render(); break;
    }
    case 'log-next': { const nx = nextSplit(d); if (!nx) return; d.sessions.push({ id: uid(), date: ymd(), day: nx, lifts: [], note: '' }); commit('p_' + pid); render(); toast(`${nx} registrato`); break; }
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form, pid = f.dataset.p, d = pd(pid); if (!d) return;
  const inp = f.querySelector('input'), val = (inp && inp.value || '').trim();
  if (!val) return;
  switch (kind) {
    case 'task': d.tasks.push({ id: uid(), title: val.slice(0, 200), area: '', due: '', done: false }); break;
    case 'task-today': d.tasks.push({ id: uid(), title: val.slice(0, 200), area: '', due: ymd(), done: false }); break;
    case 'topic': d.topics.push({ id: uid(), courseId: f.dataset.course, title: val.slice(0, 160), status: 'todo' }); break;
    case 'rule': d.rules.push({ id: uid(), text: val.slice(0, 200) }); break;
    case 'habit': d.habits.push({ id: uid(), name: val.slice(0, 60) }); break;
    case 'tag': if (!d.tags.includes(val.slice(0, 30))) d.tags.push(val.slice(0, 30)); break;
    case 'pv': { const v = num(f.querySelector('[name=val]').value); if (v == null || v <= 0) { toast('Inserisci il valore del punto, es. 20'); return; } d.settings.pointValues[val.toUpperCase().slice(0, 24)] = v; break; }
    case 'weight': { const kg = num(val); if (kg == null || kg < 30 || kg > 250) { toast('Inserisci un peso in kg, es. 72,4'); return; } d.weights = d.weights.filter(w => w.date !== ymd()); d.weights.push({ date: ymd(), kg: Math.round(kg * 10) / 10 }); toast('Peso registrato'); break; }
    case 'study-manual': { const m = num(val), sel = $('#timerCourse-' + pid); if (!m || m <= 0 || m > 720 || !sel) { toast('Inserisci i minuti, es. 45'); return; } addStudy(pid, sel.value, m); toast(`${fmtMin(m)} aggiunti a ${courseName(d, sel.value)}`); break; }
    case 'metric': { const unit = (f.querySelector('[name=unit]').value || '').trim(); d.metric = { name: val.slice(0, 40), unit: unit.slice(0, 16) }; break; }
    case 'entry': { const v = num(val); if (v == null) { toast('Inserisci un numero'); return; } const note = (f.querySelector('[name=note]').value || '').trim().slice(0, 200); d.entries.push({ id: uid(), date: ymd(), value: v, note }); if (d.entries.length > 3000) d.entries = d.entries.slice(-3000); toast('Registrato'); break; }
  }
  f.querySelectorAll('input').forEach(i => { i.value = ''; });
  commit('p_' + pid); render();
});
const textT = {}; let tfT = 0;
document.addEventListener('input', e => {
  const t = e.target, pid = t.dataset.p;
  if (t.dataset.text && pid && pd(pid)) { pd(pid)[t.dataset.text] = t.value.slice(0, 6000); clearTimeout(textT[pid]); textT[pid] = setTimeout(() => commit('p_' + pid), 600); }
  else if (t.dataset.jf && pid && pd(pid)) { const d = pd(pid), day = d.days[t.dataset.date] = d.days[t.dataset.date] || {}; day[t.dataset.jf] = t.value.slice(0, 4000); clearTimeout(textT[pid]); textT[pid] = setTimeout(() => commit('p_' + pid), 600); }
  else if (t.dataset.tf === 'q') { ui.tf.q = t.value; clearTimeout(tfT); tfT = setTimeout(() => queuePanel(), 220); }
  else if (t.dataset.goal && pid) { const g = pd(pid).goals.find(x => x.id === t.dataset.goal); if (g) { g.progress = Number(t.value); const l = document.getElementById('gp-' + g.id); if (l) l.textContent = g.progress + '%'; } }
});
document.addEventListener('change', e => {
  const t = e.target, pid = t.dataset.p;
  if (t.dataset.goal && pid) commit('p_' + pid);
  else if (t.dataset.tf && t.dataset.tf !== 'q') { ui.tf[t.dataset.tf] = t.value; queuePanel(); }
  else if (t.dataset.set && pid) { const v = num(t.value); pd(pid).settings[t.dataset.set] = v == null ? null : Math.abs(v); commit('p_' + pid); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.open && !sheet.open) closePanel();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]:not(button)')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('touchstart', () => {}, { passive: true }); // enables :active press states on iOS
sheet.addEventListener('close', () => space.classList.remove('modal'));
setInterval(() => { if (timer) { const c = $('#clock'); if (c && ($('#pvBody').dataset.for || '').startsWith(timer.pid + '|')) c.textContent = clockStr(); } }, 1000);

/* ================= Boot ================= */
$('#plusIco').outerHTML = I.plus;
const hadCache = loadCache();
if (mode === 'local' && !hadCache) seed();
ensure();
if (mode === 'local' && !hadCache) saveCacheNow();
measure(); setPauseIcon(); if (reduced) world.classList.add('static');
drawStars(); buildSystem(); renderSunLabel();
// Opening shot: the camera sweeps down onto the orbital plane while the planets launch from the star.
if (!reduced) {
  world.style.transform = worldTransform(true);
  requestAnimationFrame(() => requestAnimationFrame(() => { world.classList.add('intro'); world.style.transform = worldTransform(false); setTimeout(() => { world.classList.remove('intro'); world.classList.add('ready'); }, 2700); }));
} else world.classList.add('ready');
if (mode === 'gas') { setSync('saving', hadCache ? 'Sincronizzo…' : 'Carico i dati…'); pull(); }
else setSync('local');
})();
window.__tsbOK = 1;
